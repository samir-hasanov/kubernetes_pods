# =============================
# Namespace (EFK üçün)
# =============================
apiVersion: v1
kind: Namespace
metadata:
  name: efk

---
# =============================
# Elasticsearch Service
# =============================
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: efk
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200

---
# =============================
# Elasticsearch StatefulSet
# =============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: efk
spec:
  serviceName: "elasticsearch"
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.5.1
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
          resources:
            limits:
              memory: "2Gi"
            requests:
              memory: "1Gi"
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: elasticsearch-data
          emptyDir: {}

---
# =============================
# Kibana Service
# =============================
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: efk
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601

---
# =============================
# Kibana Deployment
# =============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: efk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z elasticsearch 9200; do echo waiting for elasticsearch; sleep 5; done;",
            ]
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.5.1
          ports:
            - containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"

---
# =============================
# Fluentd ConfigMap (bütün namespace-ləri oxuyur)
# =============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: efk
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/pods/**/*.log
      pos_file /fluentd/log/fluentd-pods.log.pos
      tag kube.*
      read_from_head true
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%N%z
        ignore_key_not_exist true
      </parse>
    </source>

    <match kube.**>
      @type elasticsearch
      host elasticsearch.efk.svc.cluster.local
      port 9200
      logstash_format true
      include_tag_key true
      flush_interval 5s
    </match>

---
# =============================
# ServiceAccount for Fluentd
# =============================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: efk

---
# =============================
# Fluentd DaemonSet
# =============================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: efk
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccountName: fluentd
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1-debian-elasticsearch
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              value: "elasticsearch.efk.svc.cluster.local"
            - name: FLUENT_ELASTICSEARCH_PORT
              value: "9200"
          resources:
            limits:
              memory: 500Mi
              cpu: 500m
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: config-volume
              mountPath: /fluentd/etc
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: config-volume
          configMap:
            name: fluentd-config

---
# =============================
# Test Pod (optional)
# =============================
apiVersion: v1
kind: Pod
metadata:
  name: logger-test
  namespace: efk
spec:
  containers:
    - name: logger
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
        - while true; do echo "$(date) Hello EFK Test"; sleep 5; done
